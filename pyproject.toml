[project]
name = "invoicer"
version = "1.0.0"
description = "Turn a time-tracker CSV export into one PDF invoice per client."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Onunkwor Raphael" }]
keywords = ["invoice", "csv", "pdf", "timesheet", "billing", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["reportlab>=4.0"]

[project.urls]
Homepage = "https://github.com/Onunkwor/invoicer"
Issues = "https://github.com/Onunkwor/invoicer/issues"

[project.scripts]
invoicer = "invoicer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["invoicer"]
